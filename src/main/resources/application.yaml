spring:
  application:
    name: notifications-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health

# Swagger UI renders the contract-first spec served from classpath:/openapi (ApiDocumentationConfig).
# springdoc's generated spec cannot be switched off without losing Swagger UI, so SecurityConfig denies /v3/api-docs.
springdoc:
  swagger-ui:
    url: /openapi/notifications-service.yaml
