spring:
  application:
    name: notifications-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      org.hibernate.envers.audit_table_suffix: _aud
  # JWT validation (A-2): signature, expiry, issuer, audience and our claims. Deployments set
  # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI, ..._JWT_AUDIENCES and NOTIFICATIONS_SECURITY_JWT_ISSUER.
  # The local and test profiles use a dev key pair instead (keys/local-jwt-public.pem).
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  # SMTP relay. Timeouts bound how long a delivery's row lock is held during a send (RFC 9).
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

notifications:
  mail:
    from: ${MAIL_FROM}
  dispatch:
    enabled: true
    poll-interval: 10s

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

# /actuator/prometheus is for publishers only (SecurityConfig); in production, a separate management port reachable
# only from the internal network (RFC 13)
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Swagger UI renders the contract-first spec served from classpath:/openapi (ApiDocumentationConfig).
# springdoc's generated spec cannot be switched off without losing Swagger UI, so SecurityConfig denies /v3/api-docs.
springdoc:
  swagger-ui:
    url: /openapi/notifications-service.yaml
