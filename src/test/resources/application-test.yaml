spring:
  # GreenMail; its port is registered by GreenMailConfiguration
  mail:
    host: 127.0.0.1
  security:
    oauth2:
      resourceserver:
        jwt:
          # Same dev key pair as the local profile; JwtTokens signs with the private key
          public-key-location: classpath:keys/local-jwt-public.pem
          audiences: notifications-service

notifications:
  mail:
    from: notifications@test.example
  # Tests run DispatchDueDeliveries themselves
  dispatch:
    enabled: false
  security:
    jwt:
      issuer: http://localhost/local-issuer
